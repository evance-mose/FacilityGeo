services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: facilitygeo
      POSTGRES_USER: facilitygeo
      POSTGRES_PASSWORD: facilitygeo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql

volumes:
  pgdata:
